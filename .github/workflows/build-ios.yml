name: 🍏 Build Jellyboxd iOS (Unsigned IPA)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: 📦 Build Unsigned iOS IPA
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🔧 Setup Xcode 26 (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: 🔍 Verify Xcode and Swift Toolchain
        run: |
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version
          swift --version
          xcodebuild -showsdks
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK path: $SDK_PATH"
          test -d "$SDK_PATH"

      - name: 📦 Install Project Dependencies
        run: |
          bun install --frozen-lockfile

      - name: 🩹 Patch Expo Dependencies for Swift 6.2
        run: |
          node ./scripts/patch-expo-modules-jsi.js

      - name: ⚙️ Expo Prebuild (Generate iOS Native Project)
        run: |
          npx expo prebuild --platform ios --clean
          node ./scripts/patch-expo-modules-jsi.js

      - name: ⚙️ Patch Podfile for Swift 5 Compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          podfile = Path("ios/Podfile")
          text = podfile.read_text()
          marker = "post_install do |installer|"
          settings = """
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['SWIFT_VERSION'] = '5.0'
                config.build_settings['SWIFT_STRICT_CONCURRENCY'] = 'minimal'
              end
            end
          """
          if marker in text and "SWIFT_STRICT_CONCURRENCY" not in text:
              text = text.replace(marker, marker + settings)
              podfile.write_text(text)
              print("✅ Patched Podfile with Swift 5 compatibility settings")
          else:
              print("⏭ Podfile already patched or marker not found")
          PY

      - name: 🔄 Re-install Pods with patched Podfile
        run: |
          cd ios && pod install

      - name: 🔗 Configure Xcode Node Environment
        run: |
          NODE_PATH="$(which node)"
          echo "export NODE_BINARY=\"$NODE_PATH\"" > ios/.xcode.env.local
          echo "export PATH=\"$(dirname "$NODE_PATH"):$PATH\"" >> ios/.xcode.env.local
          cat ios/.xcode.env.local

      - name: 🛠️ Build iOS Archive
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Jellyboxd.xcworkspace \
            -scheme Jellyboxd \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Jellyboxd.xcarchive" \
            SWIFT_VERSION=5.0 \
            SWIFT_STRICT_CONCURRENCY=minimal \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            archive 2>&1 | tee xcodebuild.log

      - name: 🔍 Debug Errors if Build Failed
        if: failure()
        run: |
          echo "=================== XCODEBUILD ERRORS ==================="
          grep -C 3 -E "(error:|fatal error:|BUILD FAILED|\*\* ARCHIVE FAILED \*\*)" xcodebuild.log || true
          echo "=================== LAST 100 LINES ==================="
          tail -n 100 xcodebuild.log

      - name: 📤 Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: xcodebuild.log
          if-no-files-found: ignore


      - name: 📦 Package Unsigned IPA
        run: |
          set -e
          APP_PATH=$(find build/Jellyboxd.xcarchive/Products/Applications -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: Could not find .app in archive"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r Jellyboxd.ipa Payload
          echo "✅ Created Jellyboxd.ipa successfully"

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyboxd-iOS-Unsigned-IPA
          path: build/Jellyboxd.ipa
          retention-days: 14

      - name: 🚀 Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Jellyboxd.ipa
          generate_release_notes: true
