name: 🍏 Build Jellyboxd iOS (Unsigned IPA)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: 📦 Build Unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🔧 Setup Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: 🔍 Verify Xcode and Swift Toolchain
        run: |
          sudo xcodebuild -runFirstLaunch || true
          sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer || true

          xcodebuild -version
          swift --version

          swift --version | grep -E 'Swift version 6\.2' || {
            echo "Expected Swift 6.2.x"
            exit 1
          }

          xcodebuild -showsdks
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$SDK_PATH"

      - name: 📦 Install Project Dependencies
        run: |
          bun install

      - name: ⚙️ Expo Prebuild (Generate iOS Native Project)
        run: |
          npx expo prebuild --platform ios --clean

      - name: 🔗 Configure Xcode Node Environment
        run: |
          NODE_PATH="$(which node)"
          echo "export NODE_BINARY=\"$NODE_PATH\"" > ios/.xcode.env.local
          echo "export PATH=\"$(dirname "$NODE_PATH"):$PATH\"" >> ios/.xcode.env.local
          cat ios/.xcode.env.local

      - name: 🛠️ Build iOS Archive
        run: |
          xcodebuild \
            -workspace ios/Jellyboxd.xcworkspace \
            -scheme Jellyboxd \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Jellyboxd.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO \
            archive

      - name: 📦 Package Unsigned IPA
        run: |
          set -e
          APP_PATH=$(find build/Jellyboxd.xcarchive/Products/Applications -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: Could not find .app in archive"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r Jellyboxd.ipa Payload
          echo "✅ Created Jellyboxd.ipa successfully"

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyboxd-iOS-Unsigned-IPA
          path: build/Jellyboxd.ipa
          retention-days: 14

      - name: 🚀 Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Jellyboxd.ipa
          generate_release_notes: true
