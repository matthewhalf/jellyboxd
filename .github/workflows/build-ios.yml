name: 🍏 Build Jellyboxd iOS (Unsigned IPA)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: 📦 Build Unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🔧 Setup Xcode 16.4 (Swift 6.2)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: 🔍 Verify Xcode and Swift Toolchain
        run: |
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version
          swift --version
          SDK_PATH="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK path: $SDK_PATH"
          test -d "$SDK_PATH"

      - name: 📦 Install Project Dependencies
        run: |
          bun install

      - name: ⚙️ Expo Prebuild (Generate iOS Native Project)
        run: |
          npx expo prebuild --platform ios --clean

      - name: 🛠️ Build iOS Archive
        run: |
          xcodebuild \
            -workspace ios/Jellyboxd.xcworkspace \
            -scheme Jellyboxd \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Jellyboxd.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: 📦 Package Unsigned IPA
        run: |
          set -e
          APP_PATH=$(find build/Jellyboxd.xcarchive/Products/Applications -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: Could not find .app in archive"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r Jellyboxd.ipa Payload
          echo "✅ Created Jellyboxd.ipa successfully"

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jellyboxd-iOS-Unsigned-IPA
          path: build/Jellyboxd.ipa
          retention-days: 14

      - name: 🚀 Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Jellyboxd.ipa
          generate_release_notes: true
